name: Deploy AngularJS app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies & build
        run: |
          npm install
          npm run build -- --base-href=/

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist/dart-haus/browser

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5